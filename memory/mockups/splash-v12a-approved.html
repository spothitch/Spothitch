<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Splash v12a</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,system-ui,sans-serif;max-width:390px;margin:0 auto;height:100vh;overflow:hidden;background:#0f1520;color:#fff}
.s{height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(180deg,#0a0f18,#12192a,#0f1520);position:relative;overflow:hidden}
.logo{text-align:center;margin-bottom:.5rem;position:relative;z-index:3}.logo img{width:72px;height:72px;border-radius:18px}.logo-text{font-size:1.8rem;font-weight:800;color:#f59e0b;margin-top:.4rem}

.road{position:absolute;bottom:34%;left:0;right:0;height:3px}.rl{position:absolute;width:50px;height:3px;background:rgba(245,158,11,0.1);border-radius:2px;animation:rm 1.8s linear infinite}.rl:nth-child(2){animation-delay:.6s}.rl:nth-child(3){animation-delay:1.2s}@keyframes rm{from{left:-60px}to{left:110%}}
.hiker{position:absolute;left:22%;bottom:22%;color:#f59e0b}.hiker svg{width:32px;height:32px;filter:drop-shadow(0 0 6px rgba(245,158,11,0.2))}.thumb{position:absolute;top:-6px;right:-18px;color:#f59e0b;animation:thumbGrow 5s ease-in-out infinite}.thumb svg{width:24px;height:24px}@keyframes thumbGrow{0%{transform:scale(1) rotate(0)}30%{transform:scale(1) rotate(0)}50%{transform:scale(1.4) rotate(-15deg)}70%{transform:scale(1.4) rotate(-15deg)}100%{transform:scale(1) rotate(0)}}
.car{position:absolute;top:32%;color:#f59e0b;animation:carPass 5s ease-in-out infinite}.car svg{width:34px;height:34px;filter:drop-shadow(0 0 6px rgba(245,158,11,0.15))}@keyframes carPass{0%{right:-60px;opacity:0}20%{opacity:1}80%{opacity:1}100%{right:320px;opacity:0}}
.sun{position:absolute;top:8%;right:14%;color:#f59e0b;opacity:.5;animation:sg 4s ease-in-out infinite}.sun svg{width:28px;height:28px}@keyframes sg{0%,100%{opacity:.4}50%{opacity:.7}}.cl{position:absolute;color:#475569;opacity:.2}.c1{top:14%;left:6%}.c1 svg{width:24px;height:24px;animation:cd 10s ease-in-out infinite}.c2{top:28%;right:10%}.c2 svg{width:18px;height:18px;animation:cd2 12s ease-in-out infinite}@keyframes cd{0%,100%{transform:translateX(0)}50%{transform:translateX(20px)}}@keyframes cd2{0%,100%{transform:translateX(0)}50%{transform:translateX(-15px)}}
.bar{height:4px;background:rgba(255,255,255,0.06);border-radius:99px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#f59e0b,#d97706);border-radius:99px;animation:bp 3s ease-in-out infinite}@keyframes bp{0%{width:15%}50%{width:65%}100%{width:15%}}.tip{font-size:14px;color:#94a3b8;line-height:1.6;text-align:center;transition:opacity .3s}</style></head><body>
<div class="s"><div class="road"><div class="rl"></div><div class="rl"></div><div class="rl"></div></div> <div class="logo"><img src="../../public/logo.png" alt="SpotHitch"><div class="logo-text">SpotHitch</div></div><div class="scene"><div class="sun"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg></div><div class="cl c1"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/></svg></div><div class="cl c2"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/></svg></div><div class="hiker"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg><div class="thumb"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 10v12"/><path d="M15 5.88 14 10h5.83a2 2 0 0 1 1.92 2.56l-2.33 8A2 2 0 0 1 17.5 22H4a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2h2.76a2 2 0 0 0 1.79-1.11L12 2a3.13 3.13 0 0 1 3 3.88Z"/></svg></div></div><div class="car"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m21 8-2 2-1.5-3.7A2 2 0 0 0 15.646 5H8.354a2 2 0 0 0-1.854 1.3L5 10 3 8"/><path d="M7 14h.01M17 14h.01"/><rect width="18" height="8" x="3" y="10" rx="2"/><path d="M5 18v2M19 18v2"/></svg></div></div><div class="bottom"><div class="bar"><div class="fill"></div></div><p class="tip" id="tip">Appuie longtemps sur la carte pour créer un spot</p></div></div>
<script>const t=["Appuie longtemps sur la carte pour créer un spot à cet endroit","Tu peux créer un spot depuis Google Maps : partage un lieu vers SpotHitch","Le mode Gardien permet à un proche de suivre ton trajet en temps réel","Configure le mode SOS avant ton trajet. Un seul geste alerte tes proches","Le faux appel simule un vrai appel entrant pour quitter une situation","Ajoute des amis pour partager tes spots favoris et tes trajets","Appuie sur une station-service sur la carte pour créer un spot station","Tu peux enregistrer audio ou vidéo comme preuve en cas de problème","Note tes voyages passés dans le journal pour garder une trace","Envoie un message privé à un autostoppeur depuis son profil","Crée un groupe de conversation pour organiser un trajet à plusieurs","Les spots les plus utiles sont ceux avec une direction précise","Active l aide communautaire pour être alerté si quelqu un a besoin d aide","Ajoute tes langues parlées pour que les autres sachent te contacter","Cherche une ville pour voir tous les spots de sortie autour","Tu peux ajouter jusqu à 3 photos par spot pour aider la communauté","Ton score de confiance augmente avec chaque spot vérifié","Vote sur la Roadmap pour décider des prochaines fonctionnalités","Consulte les guides pays avant de partir : conseils, visa, culture","SpotHitch fonctionne même sans internet grâce au mode hors ligne"];let i=0;setInterval(()=>{i=(i+1)%t.length;const e=document.getElementById("tip");e.style.opacity="0";setTimeout(()=>{e.textContent=t[i];e.style.opacity="1"},300)},4000);</script></body></html>
