    <script>
    // GLOBAL RELOAD GUARD: intercept ALL reload attempts during share flow.
    // Logs which code tries to reload so we can identify the culprit.
    (function() {
      var isShare = window.location.search.indexOf('action=share') !== -1
        || window.location.search.indexOf('url=') !== -1;
      try { if (sessionStorage.getItem('spothitch_share_flow')) isShare = true } catch(e) {}
      if (isShare) {
        // Set share flow flag immediately (before any module loads)
        try { sessionStorage.setItem('spothitch_share_flow', String(Date.now())) } catch(e) {}
        // Override location.reload to BLOCK during share flow
        var _origReload = location.reload.bind(location);
        var _reloadLog = [];
        Object.defineProperty(location, 'reload', {
          value: function() {
            var ts = Date.now();
            var stack = (new Error()).stack || '';
            var entry = { t: ts, stack: stack.slice(0, 500) };
            _reloadLog.push(entry);
            try { localStorage.setItem('spothitch_reload_blocked', JSON.stringify(_reloadLog)) } catch(e) {}
            console.warn('[RELOAD BLOCKED] Share flow active. Stack:', stack.slice(0, 300));
            // Check if share flow is still active (120s window)
            var sfTs = 0;
            try { sfTs = parseInt(sessionStorage.getItem('spothitch_share_flow') || '0', 10) } catch(e) {}
            if (sfTs && (ts - sfTs < 120000)) {
              return; // BLOCK the reload
            }
            // Share flow expired, allow reload
            _origReload();
          },
          writable: true, configurable: true
        });
      }
    })();
    </script>
    <script>
    // Stale cache recovery: if a JS module fails to load (hash mismatch after deploy),
    // delete only the stale precache, force SW update, and reload.
    // Keeps runtime caches (map tiles, API responses) intact.
    function __recoverStaleCache() {
      if (window.__swRecovery) return;
      window.__swRecovery = true;
      // Only delete the precache (workbox-precache-*), keep runtime caches
      if (caches) caches.keys().then(function(names) {
        names.forEach(function(n) { if (n.indexOf('precache') !== -1) caches.delete(n) });
      });
      // Force SW to check for update and activate immediately
      if (navigator.serviceWorker) {
        navigator.serviceWorker.getRegistrations().then(function(regs) {
          regs.forEach(function(r) { r.update() });
        });
      }
      // If a share flow is active (Google Maps share → AddSpot), DON'T reload.
      // The cache is cleared above, so next dynamic import will fetch from network.
      var isShare = window.location.search.indexOf('action=share') !== -1
        || window.location.search.indexOf('url=') !== -1
      try { if (sessionStorage.getItem('spothitch_share_flow')) isShare = true } catch(e) {}
      if (isShare) return;
      // Reload after a short delay to let the new SW activate
      setTimeout(function() { window.location.reload() }, 300);
    }
    window.addEventListener('error', function(e) {
      if (e.filename && /assets\/.*\.js$/.test(e.filename)) __recoverStaleCache();
    }, true);
    window.addEventListener('unhandledrejection', function(e) {
      var msg = e.reason && (e.reason.message || String(e.reason)) || '';
      if (msg.indexOf('Failed to fetch dynamically imported module') !== -1 || msg.indexOf('Importing a module script failed') !== -1) __recoverStaleCache();
    });
    </script>

        html{font-family:system-ui,-apple-system,sans-serif;background:#0f1520;color:#fff}
        body{margin:0;min-height:100vh;overflow-x:hidden}
        #app-loader{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0f1520;z-index:9999;transition:opacity .3s}
        #app-loader.hidden{opacity:0;pointer-events:none}
        .loader-spinner{width:48px;height:48px;border:4px solid #1a2332;border-top-color:#f59e0b;border-radius:50%;animation:spin 1s linear infinite}
        @keyframes spin{to{transform:rotate(360deg)}}
        #app{opacity:0;transition:opacity .3s}
        #app.loaded{opacity:1}
        .splash-screen{position:fixed;inset:0;z-index:9999;overflow:hidden}
        .splash-bg{position:absolute;inset:0;background:linear-gradient(180deg,#0f1520 0%,#1a2332 50%,#0f1520 100%)}
        .splash-content{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:2rem}
        .splash-logo{text-align:center;margin-bottom:1rem}
        .splash-logo-text{font-size:1.5rem;font-weight:800;color:#f59e0b;margin:.5rem 0 0;letter-spacing:-0.02em}
        .splash-animation{position:relative;width:200px;height:60px;margin:1rem auto}
        .splash-hitchhiker{position:absolute;left:30%;top:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;animation:hitchhikerBounce 2s ease-in-out infinite}
        .hitchhiker-thumb{position:absolute;top:-6px;right:-18px;animation:thumbGrow 5s ease-in-out infinite}
        .splash-car{position:absolute;right:-40px;top:50%;transform:translateY(-50%);animation:carPass 5s ease-in-out infinite}
        @keyframes hitchhikerBounce{0%,100%{transform:translate(-50%,-50%)}50%{transform:translate(-50%,-55%)}}
        @keyframes thumbGrow{0%{transform:scale(1) rotate(0)}30%{transform:scale(1) rotate(0)}50%{transform:scale(1.4) rotate(-15deg)}70%{transform:scale(1.4) rotate(-15deg)}100%{transform:scale(1) rotate(0)}}
        @keyframes carPass{0%{right:-60px;opacity:0}20%{opacity:1}80%{opacity:1}100%{right:320px;opacity:0}}
        .splash-road{position:absolute;bottom:30%;left:0;right:0;height:3px;z-index:1}
        .road-line{position:absolute;width:40px;height:3px;background:rgba(245,158,11,0.15);border-radius:2px;animation:roadMove 1.5s linear infinite}
        @keyframes roadMove{from{left:-60px}to{left:110%}}
        .splash-decorations{position:absolute;inset:0;z-index:1;pointer-events:none}
        .splash-sun{position:absolute;top:15%;right:15%;animation:sunPulse 3s ease-in-out infinite}
        @keyframes sunPulse{0%,100%{opacity:.6;transform:scale(1)}50%{opacity:1;transform:scale(1.1)}}
        .splash-cloud{position:absolute;opacity:.3}
        .splash-cloud-1{top:20%;left:10%;animation:cloudDrift1 8s linear infinite}
        .splash-cloud-2{top:35%;right:15%;animation:cloudDrift2 10s linear infinite}
        @keyframes cloudDrift1{from{transform:translateX(0)}to{transform:translateX(30px)}}
        @keyframes cloudDrift2{from{transform:translateX(0)}to{transform:translateX(-20px)}}
        .splash-exit{animation:splashFadeOut .4s ease forwards}
        @keyframes splashFadeOut{to{opacity:0;transform:scale(1.05)}}
        .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    </style>
