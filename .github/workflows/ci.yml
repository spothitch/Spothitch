name: CI/CD Pipeline

on:
  push:
    branches: [main, dev, staging, 'feature/**']
  pull_request:
    branches: [main, dev]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - name: Check duplicate HTML attributes
        run: node scripts/check-duplicate-attrs.mjs
      - name: Check dead files
        run: node scripts/check-dead-files.mjs

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run test:run -- --coverage
      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false

  wiring:
    name: Wiring & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npx vitest run tests/wiring/ tests/integration/modals.test.js

  i18n-lint:
    name: i18n Key Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: node scripts/lint-i18n.mjs

  rgpd-audit:
    name: RGPD Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: node scripts/audit-rgpd.mjs

  error-registry:
    name: Error Registry Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: node scripts/sentry-to-tests.mjs --audit

  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: node scripts/quality-gate.mjs --threshold=85

  build:
    name: Build & Bundle Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
        env:
          VITE_SHOW_BETA: 'true'
          VITE_FIREBASE_EMULATOR: 'true'
          VITE_FIREBASE_API_KEY: 'fake-api-key-for-emulator'
          VITE_FIREBASE_AUTH_DOMAIN: 'localhost'
          VITE_FIREBASE_PROJECT_ID: 'spothitch-emulator'
          VITE_FIREBASE_STORAGE_BUCKET: 'spothitch-emulator.appspot.com'
          VITE_FIREBASE_MESSAGING_SENDER_ID: '000000000000'
          VITE_FIREBASE_APP_ID: '1:000000000000:web:0000000000000000'
          VITE_FIREBASE_MEASUREMENT_ID: ''
          VITE_SENTRY_DSN: ''
      - name: Check bundle size
        run: |
          INDEX_SIZE=$(stat -c%s dist/assets/index-*.js 2>/dev/null || echo "0")
          INDEX_KB=$((INDEX_SIZE / 1024))
          echo "Main bundle: ${INDEX_KB}KB"
          if [ "$INDEX_KB" -gt 750 ]; then
            echo "::error::Main bundle exceeds 750KB limit (${INDEX_KB}KB)"
            exit 1
          fi
          echo "Bundle size OK: ${INDEX_KB}KB < 750KB"
      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  lighthouse:
    name: Lighthouse Performance Check
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Run Lighthouse CI
        run: |
          npx @lhci/cli autorun --collect.staticDistDir=dist --collect.numberOfRuns=1 --assert.preset=lighthouse:recommended --assert.assertions.categories:performance=warn --assert.assertions.categories:accessibility=warn --assert.assertions.categories:best-practices=warn --assert.assertions.categories:seo=warn || echo "Lighthouse warnings (non-blocking for now)"

  # Aikido Security runs via GitHub App (PR checks), not via CI action
  # See app.aikido.dev for scan results

  argos-visual:
    name: Argos Visual Regression
    runs-on: ubuntu-latest
    needs: build
    if: vars.ARGOS_ENABLED == 'true'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Download build
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Take screenshots
        run: |
          npx vite preview --port 4173 &
          PREVIEW_PID=$!
          trap "kill $PREVIEW_PID 2>/dev/null" EXIT
          for i in $(seq 1 30); do
            curl -sf http://localhost:4173 > /dev/null && break
            sleep 1
          done
          node -e "
          const { chromium } = require('playwright');
          const { argosScreenshot } = require('@argos-ci/playwright');
          (async () => {
            const browser = await chromium.launch();
            const ctx = await browser.newContext({ viewport: { width: 390, height: 844 } });
            const page = await ctx.newPage();
            await page.addInitScript(() => {
              localStorage.setItem('spothitch_welcomed', 'true');
              localStorage.setItem('spothitch_age_verified', 'true');
              localStorage.setItem('spothitch_cookie_consent', 'true');
              localStorage.setItem('spothitch_landing_seen', 'true');
            });
            await page.goto('http://localhost:4173', { waitUntil: 'networkidle', timeout: 30000 });
            await page.waitForTimeout(3000);
            await page.evaluate(() => window.setState?.({ showWelcome: false, showLanding: false, showAgeVerification: false, showCookieBanner: false }));
            await page.waitForTimeout(500);
            await argosScreenshot(page, 'map');
            await page.evaluate(() => window.changeTab?.('voyage'));
            await page.waitForTimeout(1000);
            await argosScreenshot(page, 'voyage');
            await page.evaluate(() => window.changeTab?.('social'));
            await page.waitForTimeout(1000);
            await argosScreenshot(page, 'social');
            await page.evaluate(() => window.changeTab?.('profile'));
            await page.waitForTimeout(1000);
            await argosScreenshot(page, 'profile');
            await browser.close();
          })();
          "
      - name: Upload to Argos
        run: npx @argos-ci/cli upload screenshots/
        env:
          ARGOS_TOKEN: ${{ secrets.ARGOS_TOKEN }}

  firebase-integration:
    name: Firebase Integration Tests
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - run: npm ci
      - name: Start Firebase Emulators
        run: |
          npx firebase emulators:start --only auth,firestore --project spothitch-emulator &
          for i in $(seq 1 30); do
            curl -s http://127.0.0.1:9099/ > /dev/null 2>&1 && echo "Auth emulator ready" && break
            sleep 1
          done
          curl -s http://127.0.0.1:8080/ > /dev/null 2>&1 && echo "Firestore emulator ready" || sleep 5
      - name: Setup test accounts
        run: node scripts/firebase-test-setup.mjs
        env:
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
          FIREBASE_AUTH_EMULATOR_HOST: '127.0.0.1:9099'
          FIRESTORE_EMULATOR_HOST: '127.0.0.1:8080'
          VITE_FIREBASE_API_KEY: 'fake-api-key-for-emulator'
          VITE_FIREBASE_AUTH_DOMAIN: 'localhost'
          VITE_FIREBASE_PROJECT_ID: 'spothitch-emulator'
          VITE_FIREBASE_STORAGE_BUCKET: 'spothitch-emulator.appspot.com'
          VITE_FIREBASE_MESSAGING_SENDER_ID: '000000000000'
          VITE_FIREBASE_APP_ID: '1:000000000000:web:0000000000000000'
      - name: Run Firebase tests
        run: node scripts/firebase-test.mjs
        env:
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
          FIREBASE_AUTH_EMULATOR_HOST: '127.0.0.1:9099'
          FIRESTORE_EMULATOR_HOST: '127.0.0.1:8080'
          VITE_FIREBASE_API_KEY: 'fake-api-key-for-emulator'
          VITE_FIREBASE_AUTH_DOMAIN: 'localhost'
          VITE_FIREBASE_PROJECT_ID: 'spothitch-emulator'
          VITE_FIREBASE_STORAGE_BUCKET: 'spothitch-emulator.appspot.com'
          VITE_FIREBASE_MESSAGING_SENDER_ID: '000000000000'
          VITE_FIREBASE_APP_ID: '1:000000000000:web:0000000000000000'

  e2e-core:
    name: E2E Core (navigation, admin, social, profile)
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - name: Start Firebase Emulators
        run: |
          npx firebase emulators:start --only auth,firestore --project spothitch-emulator &
          for i in $(seq 1 30); do
            curl -s http://127.0.0.1:9099/ > /dev/null 2>&1 && echo "Auth emulator ready" && break
            sleep 1
          done
          curl -s http://127.0.0.1:8080/ > /dev/null 2>&1 && echo "Firestore emulator ready" || sleep 5
      - name: Download build
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - run: npx playwright test --project=chromium e2e/navigation.spec.js e2e/admin.spec.js e2e/social.spec.js e2e/socialDeep.spec.js e2e/profile.spec.js e2e/profileDeep.spec.js e2e/tutorial.spec.js e2e/gamification.spec.js e2e/gamificationDeep.spec.js e2e/errorHandling.spec.js
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-core-report
          path: playwright-report/

