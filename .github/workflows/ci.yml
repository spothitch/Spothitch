          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
      - name: Sanitize commit message
        id: sanitize
        run: |
          MSG=$(git log -1 --pretty=%s | LC_ALL=C tr -cd '[:print:]' | head -c 100)
          echo "msg=${MSG}" >> $GITHUB_OUTPUT
      - name: Deploy preview to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name spothitch --branch dev --commit-message "${{ steps.sanitize.outputs.msg }}"
      - name: Post-deploy health check
        run: |
          echo "Waiting 30s for deploy propagation..."
          sleep 30
          curl -sf https://spothitch.com > /dev/null && echo "Site is live" || (echo "Site unreachable" && exit 1)

  deploy-staging:
