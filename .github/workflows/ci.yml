      - run: npx playwright test --project=chromium e2e/comprehensiveE2E.spec.js e2e/spotDetail.spec.js e2e/addSpotWizard.spec.js e2e/guides.spec.js e2e/tripPlanner.spec.js
      - uses: actions/upload-artifact@v7
