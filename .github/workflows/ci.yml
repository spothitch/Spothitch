      - run: npx playwright test --project=chromium e2e/regression.spec.js e2e/handlerCoverage.spec.js e2e/guardian-complete.spec.js e2e/radarBuddies.spec.js e2e/sosGuardian.spec.js e2e/visualTests.spec.js e2e/round01-auth.spec.js e2e/round02-profile.spec.js e2e/round03-spots.spec.js e2e/round04-social.spec.js e2e/round05-groups-chat.spec.js e2e/round06-guardian.spec.js e2e/round07-sos.spec.js e2e/round08-events-companion.spec.js e2e/round09-guides-roadmap.spec.js e2e/round10-admin.spec.js e2e/round11-offline-pwa.spec.js e2e/round12-stress-perf.spec.js e2e/round13-granular-auth.spec.js e2e/round14-granular-features.spec.js e2e/round15-xss-comprehensive.spec.js e2e/round16-edge-cases.spec.js e2e/round17-cross-user.spec.js e2e/firebase-auth.spec.js e2e/firebase-data.spec.js e2e/firebase-gamification.spec.js e2e/firebase-realtime.spec.js e2e/firebase-security.spec.js e2e/firebase-social.spec.js e2e/firebase-spots.spec.js
        env:
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
          FIREBASE_AUTH_EMULATOR_HOST: '127.0.0.1:9099'
          FIRESTORE_EMULATOR_HOST: '127.0.0.1:8080'
      - uses: actions/upload-artifact@v7
        if: always()
