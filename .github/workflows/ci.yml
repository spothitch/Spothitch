      - run: npx playwright test --project=chromium e2e/monkeyTest.spec.js e2e/userJourneys.spec.js e2e/map.spec.js e2e/mapDeep.spec.js e2e/userChains.spec.js e2e/performance.spec.js e2e/multi-user-full.spec.js
      - uses: actions/upload-artifact@v7
