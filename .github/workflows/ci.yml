  e2e-multi-user:
    name: E2E Multi-User (Phase ${{ matrix.phase }})
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        phase: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - name: Start Firebase Emulators
        run: |
          npx firebase emulators:start --only auth,firestore --project spothitch-emulator &
          for i in $(seq 1 30); do
            curl -s http://127.0.0.1:9099/ > /dev/null 2>&1 && echo "Auth emulator ready" && break
            sleep 1
          done
          curl -s http://127.0.0.1:8080/ > /dev/null 2>&1 && echo "Firestore emulator ready" || sleep 5
      - name: Download build
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Run multi-user phase ${{ matrix.phase }}
        run: npx playwright test --project=chromium e2e/multi-user-phase${{ matrix.phase }}*.spec.js
        env:
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
          FIREBASE_AUTH_EMULATOR_HOST: '127.0.0.1:9099'
          FIRESTORE_EMULATOR_HOST: '127.0.0.1:8080'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-multi-user-phase${{ matrix.phase }}-report
          path: playwright-report/

  deploy:
    name: Deploy to Cloudflare Pages (main → spothitch.com)
    runs-on: ubuntu-latest
    needs: [build, test, wiring, lint, quality-gate, e2e-core, e2e-features, e2e-comprehensive, e2e-stress, e2e-functional-1, e2e-functional-2, e2e-rounds, e2e-multi-user]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Build with Firebase config
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
      - name: Sanitize commit message
        id: sanitize
        run: |
          MSG=$(git log -1 --pretty=%s | LC_ALL=C tr -cd '[:print:]' | head -c 100)
          echo "msg=${MSG}" >> $GITHUB_OUTPUT
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name spothitch --branch main --commit-message "${{ steps.sanitize.outputs.msg }}"
      - name: Post-deploy health check
        run: |
          echo "Waiting 30s for deploy propagation..."
          sleep 30
          curl -sf https://spothitch.com > /dev/null && echo "Site is live" || (echo "Site unreachable" && exit 1)

  deploy-dev:
    name: Deploy to Cloudflare Pages (dev → preview)
    runs-on: ubuntu-latest
    needs: [build, test, wiring, lint, quality-gate, e2e-core, e2e-features, e2e-comprehensive, e2e-stress, e2e-functional-1, e2e-functional-2, e2e-rounds]
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
    # Note: feature/* branches run tests only, no deploy
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
