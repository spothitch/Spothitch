      - run: npx playwright test --project=chromium e2e/criticalFlows.spec.js e2e/accessibility.spec.js e2e/pwa.spec.js e2e/deeplinks.spec.js e2e/keyboard.spec.js e2e/browserEvents.spec.js
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-features-report
          path: playwright-report/

  e2e-comprehensive:
